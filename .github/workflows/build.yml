# Builds the mod on every push and pull request, with every build gate (KERNEL32-only imports,
# the exact delay-load list, no start-up constructors, no %ls). The DLL is kept as a workflow
# artifact for a few days.
#
# The host test (tools\run-host-test.ps1) is not run here: it needs Direct3D 11 output and Windows'
# media sessions, which GitHub's server runners do not offer reliably. It runs on the developer's PC
# before every commit (CLAUDE.md).

name: build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The Windows SDK and the music libraries that build\fetch-deps.ps1 downloads (each checked
      # against a fixed hash). Cached by the script's own content, so a new pin fetches again.
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('build/fetch-deps.ps1') }}

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: music-panel-version-dll
          path: out/version.dll
          retention-days: 7
