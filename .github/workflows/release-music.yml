# Publishes the music player as a GitHub Release ("Music player 0.3.2", marked Latest, the green
# label in the repository's sidebar) when a tag like music-v0.3.2 is pushed:
#   git tag music-v0.3.2 && git push origin music-v0.3.2
# The DLL's own version (src\loader\version.rc) must match the tag, so a release can never carry
# a DLL that says something else. The zip holds version.dll, a short install guide in both
# languages, the licence and the third-party notices. Its name has no version in it on purpose:
# the README links straight to releases/latest/download/racing-master-music-player.zip, which
# always downloads the newest release (the owner, 2026-11-15: a direct download players can find).
#
# The DLSS plugin gets its own workflow and its own tags (dlss-v...), so the two are downloaded
# and installed separately.

name: release music player

on:
  push:
    tags: ['music-v*']

permissions:
  contents: write   # to create the release

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('build/fetch-deps.ps1') }}

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1

      - name: Check the DLL's version against the tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $want = $tag.Substring('music-v'.Length)
          $have = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'out\version.dll')).FileVersion
          if ($have -ne $want) { throw "The tag says $want but version.dll says $have. Bump the version first." }
          "version=$want" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pack
        shell: pwsh
        run: |
          $dir = 'racing-master-music-player'
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item out\version.dll, LICENSE, THIRD_PARTY.md $dir
          Copy-Item docs\release\INSTALL-music-panel.txt (Join-Path $dir 'INSTALL.txt')
          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower() + "  $dir.zip" | Out-File "$dir.zip.sha256" -Encoding ascii

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $notes = @"
          《巔峰極速》PC 版音樂面板 $v。下載下面的 racing-master-music-player.zip，解壓縮後照 INSTALL.txt 或 README 的步驟安裝。請先用分身帳號試：遊戲並不允許模組，帳號有可能被封。

          Music player $v for Racing Master (PC). Download racing-master-music-player.zip below, unzip it and follow INSTALL.txt or the README. Try it on a spare account first: the game does not allow mods and an account can be banned.
          "@
          gh release create '${{ github.ref_name }}' 'racing-master-music-player.zip' 'racing-master-music-player.zip.sha256' `
            --title "Music player $v" --notes $notes --latest
